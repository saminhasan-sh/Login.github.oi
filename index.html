                                                                                                // ─── Statistics Page ────────────────────────────────────────────
                                                                                                function StatisticsPage({ vocab, wrongWords, quizAttempts }) {
                                                                                                    const totalWords = vocab.length;
                                                                                                    const favoriteWords = vocab.filter(v => v.favorite).length;
                                                                                                    const totalAttempts = quizAttempts.length;
                                                                                                    const totalCorrect = quizAttempts.reduce((s, a) => s + a.correct, 0);
                                                                                                    const totalWrong = quizAttempts.reduce((s, a) => s + a.wrong, 0);
                                                                                                    const totalQuestions = totalCorrect + totalWrong;
                                                                                                    const overallAccuracy = totalQuestions > 0 ?
                                                                                                        Math.round((totalCorrect / totalQuestions) * 100) : 0;

                                                                                                    // Most missed words
                                                                                                    const wrongCounts = {};
                                                                                                    quizAttempts.forEach(a => {
                                                                                                        (a.wrongWordIds || []).forEach(id => {
                                                                                                            wrongCounts[id] = (wrongCounts[id] || 0) + 1;
                                                                                                        });
                                                                                                    });
                                                                                                    const missedWords = Object.entries(wrongCounts)
                                                                                                        .sort((a, b) => b[1] - a[1])
                                                                                                        .slice(0, 10)
                                                                                                        .map(([id, count]) => {
                                                                                                            const word = vocab.find(v => v.id === id);
                                                                                                            return { ...word, missCount: count };
                                                                                                        })
                                                                                                        .filter(w => w && w.russian);

                                                                                                    // Category distribution
                                                                                                    const categoryCounts = {};
                                                                                                    vocab.forEach(v => {
                                                                                                        const c = v.category || 'Other';
                                                                                                        categoryCounts[c] = (categoryCounts[c] || 0) + 1;
                                                                                                    });
                                                                                                    const categoryEntries = Object.entries(categoryCounts)
                                                                                                        .sort((a, b) => b[1] - a[1]);

                                                                                                    // Recent attempts
                                                                                                    const recent = quizAttempts.slice(0, 5);

                                                                                                    const stats = [
                                                                                                        { label: 'Total Words', value: totalWords, icon: 'fa-book',
                                                                                                            color: 'text-indigo-600' },
                                                                                                        { label: 'Favorites', value: favoriteWords, icon: 'fa-star',
                                                                                                            color: 'text-amber-500' },
                                                                                                        { label: 'Quiz Attempts', value: totalAttempts,
                                                                                                            icon: 'fa-question-circle',
                                                                                                            color: 'text-emerald-600' },
                                                                                                        { label: 'Accuracy', value: overallAccuracy + '%',
                                                                                                            icon: 'fa-bullseye', color: 'text-rose-600' },
                                                                                                        { label: 'Wrong Words', value: wrongWords.length,
                                                                                                            icon: 'fa-exclamation-triangle',
                                                                                                            color: 'text-orange-500' },
                                                                                                        { label: 'Questions Answered', value: totalQuestions,
                                                                                                            icon: 'fa-check-double', color: 'text-cyan-600' },
                                                                                                    ];

                                                                                                    return ( <
                                                                                                        div className = "space-y-5 fade-in" >
                                                                                                        <
                                                                                                        div className = "grid grid-cols-2 lg:grid-cols-3 gap-3 md:gap-4" > {
                                                                                                            stats.map(s => ( <
                                                                                                                div key = { s.label }
                                                                                                                className = "stat-card" >
                                                                                                                <
                                                                                                                div className = "flex items-start justify-between" >
                                                                                                                <
                                                                                                                div >
                                                                                                                <
                                                                                                                div className = "stat-number" > { s
                                                                                                                        .value } < /div> <
                                                                                                                div className = "stat-label mt-0.5" >
                                                                                                                { s.label } < /div> <
                                                                                                                /div> <
                                                                                                                i className = { `fa-regular ${s.icon} text-xl opacity-40 ${s.color}` } >
                                                                                                                < /i> <
                                                                                                                /div> <
                                                                                                                /div>
                                                                                                            ))
                                                                                                        } <
                                                                                                        /div>

                                                                                                        <
                                                                                                        div className = "grid grid-cols-1 md:grid-cols-2 gap-4" >
                                                                                                        <
                                                                                                        div className = "card p-4 md:p-6" >
                                                                                                        <
                                                                                                        h3 className = "font-semibold text-slate-700 mb-3" >
                                                                                                        Category Distribution < /h3> {
                                                                                                            categoryEntries.length === 0 ? ( <
                                                                                                                div className = "text-sm text-slate-400" >
                                                                                                                No words yet < /div>
                                                                                                            ) : ( <
                                                                                                                div className = "space-y-2" > {
                                                                                                                    categoryEntries.map(([name,
                                                                                                                        count]) => ( <
                                                                                                                        div key = { name }
                                                                                                                        className = "flex items-center justify-between text-sm" >
                                                                                                                        <
                                                                                                                        span className = "text-slate-600" >
                                                                                                                        { name } < /span> <
                                                                                                                        span className = "font-medium text-slate-800" >
                                                                                                                        { count } < /span> <
                                                                                                                        /div>
                                                                                                                    ))
                                                                                                                } <
                                                                                                                /div>
                                                                                                            )
                                                                                                        } <
                                                                                                        /div>

                                                                                                        <
                                                                                                        div className = "card p-4 md:p-6" >
                                                                                                        <
                                                                                                        h3 className = "font-semibold text-slate-700 mb-3" >
                                                                                                        Most Missed Words < /h3> {
                                                                                                            missedWords.length === 0 ? ( <
                                                                                                                div className = "text-sm text-slate-400" >
                                                                                                                No missed words yet < /div>
                                                                                                            ) : ( <
                                                                                                                div className = "space-y-2" > {
                                                                                                                    missedWords.map((w, i) => ( <
                                                                                                                        div key = { w.id }
                                                                                                                        className = "flex items-center justify-between text-sm py-1" >
                                                                                                                        <
                                                                                                                        span className = "text-slate-600" >
                                                                                                                        { w.russian } < /span> <
                                                                                                                        span className = "text-xs font-medium text-rose-500 bg-rose-50 px-2 py-0.5 rounded-full" >
                                                                                                                        { w.missCount }× < /span> <
                                                                                                                        /div>
                                                                                                                    ))
                                                                                                                } <
                                                                                                                /div>
                                                                                                            )
                                                                                                        } <
                                                                                                        /div> <
                                                                                                        /div>

                                                                                                        <
                                                                                                        div className = "card p-4 md:p-6" >
                                                                                                        <
                                                                                                        h3 className = "font-semibold text-slate-700 mb-3" >
                                                                                                        Recent Quiz Attempts < /h3> {
                                                                                                            recent.length === 0 ? ( <
                                                                                                                div className = "text-sm text-slate-400" >
                                                                                                                No attempts yet < /div>
                                                                                                            ) : ( <
                                                                                                                div className = "space-y-2" > {
                                                                                                                    recent.map(a => ( <
                                                                                                                        div key = { a.id }
                                                                                                                        className = "flex items-center justify-between text-sm py-1.5 border-b border-slate-50 last:border-0" >
                                                                                                                        <
                                                                                                                        span className = "text-slate-600" >
                                                                                                                        { new Date(a.date)
                                                                                                                            .toLocaleDateString() }
                                                                                                                        <
                                                                                                                        span className = "text-xs text-slate-400 ml-2" >
                                                                                                                        { a.mode } < /span> <
                                                                                                                        /span> <
                                                                                                                        span className = "flex items-center gap-3" >
                                                                                                                        <
                                                                                                                        span className = "text-emerald-600" >
                                                                                                                        ✓{ a.correct } < /span> <
                                                                                                                        span className = "text-rose-600" >
                                                                                                                        ✗{ a.wrong } < /span> <
                                                                                                                        span className = "font-medium text-indigo-600" >
                                                                                                                        { a.accuracy } % < /span> <
                                                                                                                        /span> <
                                                                                                                        /div>
                                                                                                                    ))
                                                                                                                } <
                                                                                                                /div>
                                                                                                            )
                                                                                                        } <
                                                                                                        /div> <
                                                                                                        /div>
                                                                                                    );
                                                                                                }

                                                                                                // ─── Mount ──────────────────────────────────────────────────────
                                                                                                const root = ReactDOM.createRoot(document.getElementById('root'));
                                                                                                root.render( < App / > );
    </script>
</body>
</html>
